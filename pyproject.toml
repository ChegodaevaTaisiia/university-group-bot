[project]
name = "university-group-bot"
version = "0.1.0"
description = "Телеграм-бот для студенческой группы: расписание, ДЗ, напоминания, ИИ-ассистент"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "SQLAlchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "APScheduler>=3.10,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["bot/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # aiogram/FastAPI-style default calls in signatures

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
