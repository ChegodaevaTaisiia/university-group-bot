services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data          # база и файлы лежат рядом в ./data — легко бэкапить
    # сеть хоста: на VPS без IPv6 в docker-бридже, но с рабочим IPv6 на хосте
    network_mode: host
    # логи: docker compose logs -f bot
